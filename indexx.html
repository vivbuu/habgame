<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Платформы и камни</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            font-family: monospace;
            touch-action: none;
        }
        canvas {
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: #1a1a3e;
        }
        #score {
            color: #ff6b6b;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #btns {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .btn {
            width: 100px;
            height: 60px;
            background: #ff6b6b;
            border: none;
            border-radius: 12px;
            font-size: 26px;
            color: white;
            cursor: pointer;
            user-select: none;
        }
        .btn:active { background: #ff4444; }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="game"></canvas>
    <div id="btns">
        <button class="btn" id="leftBtn">◄</button>
        <button class="btn" id="rightBtn">►</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const W = 350;
        const H = 500;
        canvas.width = W;
        canvas.height = H;

        // Игрок
        const player = {
            x: W/2 - 15,
            y: 0,
            w: 30,
            h: 30,
            vy: 0,
            onGround: false
        };

        const GRAVITY = 0.6;
        const JUMP = -10;
        const SPEED = 5;

        let platforms = [];
        let rocks = [];
        let score = 0;
        let gameOver = false;
        let gameLoop;
        let spawnTimer = 0;
        let difficulty = 1;

        // Кнопки
        let leftDown = false;
        let rightDown = false;

        function reset() {
            player.x = W/2 - 15;
            player.y = 100;
            player.vy = 0;
            player.onGround = false;
            platforms = [{x: 0, y: H - 40, w: W, h: 20}];
            // Стартовые платформы
            for (let i = 0; i < 5; i++) {
                platforms.push({
                    x: Math.random() * (W - 80),
                    y: 80 + i * 80,
                    w: 70 + Math.random() * 50,
                    h: 15
                });
            }
            rocks = [];
            score = 0;
            gameOver = false;
            difficulty = 1;
            spawnTimer = 0;
            scoreEl.textContent = 'Счёт: 0';
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 16);
        }

        function update() {
            if (gameOver) return;

            // Движение игрока
            if (leftDown) player.x -= SPEED;
            if (rightDown) player.x += SPEED;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > W) player.x = W - player.w;

            // Гравитация
            player.vy += GRAVITY;
            player.y += player.vy;

            // Проверка платформ
            player.onGround = false;
            for (let p of platforms) {
                if (player.vy >= 0 &&
                    player.x + player.w > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.h >= p.y &&
                    player.y + player.h <= p.y + p.h + 10) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // Падение за экран
            if (player.y > H + 50) endGame();

            // Камера (плавно)
            const targetCamY = player.y - H/2;
            const camY = Math.max(0, targetCamY);
            const shiftY = camY;

            // Спавн камней
            spawnTimer++;
            if (spawnTimer > 40 - difficulty) {
                spawnTimer = 0;
                rocks.push({
                    x: Math.random() * (W - 25),
                    y: camY - 30,
                    w: 25,
                    h: 25,
                    vy: 2 + Math.random() * 4
                });
            }

            // Обновление камней
            for (let r of rocks) {
                r.y += r.vy;
                // Столкновение с игроком
                if (player.x + player.w > r.x &&
                    player.x < r.x + r.w &&
                    player.y + player.h > r.y &&
                    player.y < r.y + r.h) {
                    endGame();
                    return;
                }
            }
            // Удаляем упавшие камни
            rocks = rocks.filter(r => r.y < camY + H + 50);

            // Спавн новых платформ сверху
            if (platforms.length < 8) {
                platforms.push({
                    x: Math.random() * (W - 80),
                    y: camY - Math.random() * 100,
                    w: 70 + Math.random() * 50,
                    h: 15
                });
            }
            // Удаляем платформы снизу
            platforms = platforms.filter(p => p.y > camY - H);

            // Счёт увеличивается
            score++;
            if (score % 300 === 0) difficulty = Math.min(difficulty + 1, 20);
            scoreEl.textContent = 'Счёт: ' + Math.floor(score / 10);

            draw(shiftY);
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ff6b6b';
            ctx.font = '22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('КАМЕНЬ ПОПАЛ!', W/2, H/2 - 10);
            ctx.font = '14px monospace';
            ctx.fillText('Коснись экрана чтобы начать заново', W/2, H/2 + 25);
        }

        function draw(shiftY) {
            ctx.clearRect(0, 0, W, H);

            // Звёзды
            ctx.fillStyle = '#ffffff33';
            for (let i = 0; i < 40; i++) {
                const sx = (i * 137 + 50) % W;
                const sy = ((i * 97) - shiftY * 0.3) % H;
                if (sy < 0) continue;
                ctx.fillRect(sx, sy, 2, 2);
            }

            // Платформы
            for (let p of platforms) {
                const py = p.y - shiftY;
                if (py < -20 || py > H + 20) continue;
                ctx.fillStyle = '#4ecdc4';
                ctx.fillRect(p.x, py, p.w, p.h);
                ctx.fillStyle = '#3db8b0';
                ctx.fillRect(p.x, py, p.w, 4);
            }

            // Камни
            for (let r of rocks) {
                const ry = r.y - shiftY;
                if (ry < -30 || ry > H + 30) continue;
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.moveTo(r.x + r.w/2, ry);
                ctx.lineTo(r.x + r.w, ry + r.h*0.7);
                ctx.lineTo(r.x + r.w*0.8, ry + r.h);
                ctx.lineTo(r.x + r.w*0.2, ry + r.h);
                ctx.lineTo(r.x, ry + r.h*0.7);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#666';
                ctx.stroke();
            }

            // Игрок
            const py = player.y - shiftY;
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(player.x, py, player.w, player.h);
            // Глаза
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 6, py + 7, 7, 7);
            ctx.fillRect(player.x + 17, py + 7, 7, 7);
            ctx.fillStyle = '#111';
            ctx.fillRect(player.x + 8, py + 9, 4, 4);
            ctx.fillRect(player.x + 19, py + 9, 4, 4);
        }

        function jump() {
            if (player.onGround && !gameOver) {
                player.vy = JUMP;
                player.onGround = false;
            }
        }

        // Управление
        document.getElementById('leftBtn').addEventListener('pointerdown', e => { e.preventDefault(); leftDown = true; });
        document.getElementById('leftBtn').addEventListener('pointerup', e => { e.preventDefault(); leftDown = false; });
        document.getElementById('leftBtn').addEventListener('pointerleave', e => { leftDown = false; });

        document.getElementById('rightBtn').addEventListener('pointerdown', e => { e.preventDefault(); rightDown = true; });
        document.getElementById('rightBtn').addEventListener('pointerup', e => { e.preventDefault(); rightDown = false; });
        document.getElementById('rightBtn').addEventListener('pointerleave', e => { rightDown = false; });

        // Тап по канвасу = прыжок
        canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameOver) reset(); else jump(); });
        canvas.addEventListener('click', e => { if (gameOver) reset(); else jump(); });

        // Клавиатура
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); leftDown = true; }
            if (e.key === 'ArrowRight') { e.preventDefault(); rightDown = true; }
            if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (gameOver) reset(); else jump(); }
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') leftDown = false;
            if (e.key === 'ArrowRight') rightDown = false;
        });

        reset();
    </script>
</body>
</html>
