<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Платформы и камни</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: monospace;
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: #1a1a3e;
        }
        #score {
            color: #ff6b6b;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #hint {
            color: #888;
            font-size: 12px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="game"></canvas>
    <div id="hint">◄ свайп влево | свайп вправо ► | тап — прыжок</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const W = 360;
        const H = 520;
        canvas.width = W;
        canvas.height = H;

        const player = { x: W/2 - 15, y: 100, w: 28, h: 28, vy: 0, onGround: false, dir: 0 };
        const GRAVITY = 0.5;
        const JUMP_FORCE = -9;
        const MOVE_SPEED = 4;
        const MAX_JUMP_HEIGHT = 80;
        const MAX_JUMP_WIDTH = 90;

        let platforms = [];
        let rocks = [];
        let score = 0;
        let gameOver = false;
        let gameLoop;
        let spawnTimer = 0;
        let difficulty = 1;

        // Свайпы
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let movingLeft = false;
        let movingRight = false;

        function reset() {
            player.x = W/2 - 14;
            player.y = 100;
            player.vy = 0;
            player.onGround = false;
            player.dir = 0;
            movingLeft = false;
            movingRight = false;

            platforms = [{x: 0, y: H - 40, w: W, h: 20}];
            // Генерируем достижимые платформы
            let lastY = H - 40;
            for (let i = 0; i < 8; i++) {
                const p = generateReachablePlatform(lastY);
                platforms.push(p);
                lastY = p.y;
            }
            rocks = [];
            score = 0;
            gameOver = false;
            difficulty = 1;
            spawnTimer = 0;
            scoreEl.textContent = 'Счёт: 0';
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 16);
        }

        function generateReachablePlatform(fromY) {
            const newY = fromY - 60 - Math.random() * 40; // 60-100 пикселей выше
            // Ограничиваем горизонтальное расстояние чтобы можно было допрыгнуть
            const maxDx = MAX_JUMP_WIDTH;
            const minX = Math.max(10, player.x - maxDx);
            const maxX = Math.min(W - 80, player.x + maxDx);
            const newX = minX + Math.random() * (maxX - minX);
            return {
                x: newX,
                y: newY,
                w: 60 + Math.random() * 40,
                h: 14
            };
        }

        function update() {
            if (gameOver) return;

            // Движение
            if (movingLeft) { player.x -= MOVE_SPEED; player.dir = -1; }
            else if (movingRight) { player.x += MOVE_SPEED; player.dir = 1; }
            else player.dir = 0;

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > W) player.x = W - player.w;

            // Гравитация
            player.vy += GRAVITY;
            player.y += player.vy;

            // Проверка платформ
            player.onGround = false;
            for (let p of platforms) {
                if (player.vy >= 0 &&
                    player.x + player.w > p.x + 4 &&
                    player.x < p.x + p.w - 4 &&
                    player.y + player.h >= p.y &&
                    player.y + player.h <= p.y + p.h + 12) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // Падение
            if (player.y > H + 60) endGame();

            // Камера
            const targetCamY = player.y - H/2;
            const camY = Math.max(0, targetCamY);
            const shiftY = camY;

            // Камни
            spawnTimer++;
            const spawnRate = Math.max(15, 40 - difficulty);
            if (spawnTimer > spawnRate) {
                spawnTimer = 0;
                rocks.push({
                    x: Math.random() * (W - 22),
                    y: camY - 30,
                    w: 22,
                    h: 22,
                    vy: 2 + Math.random() * 3
                });
            }

            for (let r of rocks) {
                r.y += r.vy;
                if (player.x + player.w > r.x + 3 &&
                    player.x < r.x + r.w - 3 &&
                    player.y + player.h > r.y + 3 &&
                    player.y < r.y + r.h - 3) {
                    endGame();
                    return;
                }
            }
            rocks = rocks.filter(r => r.y < camY + H + 50);

            // Новые платформы
            const highestPlatform = platforms.reduce((min, p) => p.y < min ? p.y : min, Infinity);
            while (highestPlatform > camY - H) {
                // Добавляем выше
            }
            if (platforms.length < 10) {
                const lowestY = platforms.reduce((min, p) => p.y < min ? p.y : min, Infinity);
                const p = generateReachablePlatform(lowestY);
                platforms.push(p);
            }
            platforms = platforms.filter(p => p.y > camY - H - 100);

            score++;
            if (score % 200 === 0) difficulty = Math.min(difficulty + 1, 20);
            scoreEl.textContent = 'Счёт: ' + Math.floor(score / 10);

            draw(shiftY);
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ff6b6b';
            ctx.font = '22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Игра окончена!', W/2, H/2 - 10);
            ctx.font = '14px monospace';
            ctx.fillText('Тапни чтобы заново', W/2, H/2 + 25);
        }

        function draw(shiftY) {
            ctx.clearRect(0, 0, W, H);

            // Фон
            ctx.fillStyle = '#ffffff15';
            for (let i = 0; i < 30; i++) {
                const sx = (i * 173 + 40) % W;
                const sy = ((i * 89) - shiftY * 0.2) % H;
                if (sy < 0) continue;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }

            // Платформы
            for (let p of platforms) {
                const py = p.y - shiftY;
                if (py < -20 || py > H + 20) continue;
                ctx.fillStyle = '#4ecdc4';
                ctx.fillRect(p.x, py, p.w, p.h);
                ctx.fillStyle = '#3db8b0';
                ctx.fillRect(p.x, py, p.w, 4);
            }

            // Камни
            for (let r of rocks) {
                const ry = r.y - shiftY;
                if (ry < -30 || ry > H + 30) continue;
                ctx.fillStyle = '#999';
                ctx.beginPath();
                const cx = r.x + r.w/2;
                ctx.moveTo(cx, ry);
                ctx.lineTo(r.x + r.w, ry + r.h*0.6);
                ctx.lineTo(r.x + r.w*0.8, ry + r.h);
                ctx.lineTo(r.x + r.w*0.2, ry + r.h);
                ctx.lineTo(r.x, ry + r.h*0.6);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Игрок
            const py = player.y - shiftY;
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(player.x, py, player.w, player.h);
            // Глазки
            ctx.fillStyle = '#fff';
            const eyeY = py + 7;
            ctx.fillRect(player.x + 5, eyeY, 7, 7);
            ctx.fillRect(player.x + 16, eyeY, 7, 7);
            ctx.fillStyle = '#111';
            ctx.fillRect(player.x + 7, eyeY + 2, 3.5, 3.5);
            ctx.fillRect(player.x + 18, eyeY + 2, 3.5, 3.5);
        }

        function jump() {
            if (player.onGround && !gameOver) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
            }
        }

        // Управление касаниями
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchStartTime = Date.now();
        });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            // Горизонтальный свайп = движение
            if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
                movingLeft = dx < -10;
                movingRight = dx > 10;
            }
        });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            const dt = Date.now() - touchStartTime;
            const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
            const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
            // Короткий тап без сильного движения = прыжок
            if (dt < 250 && dx < 20 && dy < 20) {
                if (gameOver) reset();
                else jump();
            }
            // Отпустили — стоим
            movingLeft = false;
            movingRight = false;
        });

        // Клавиатура для ПК
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); movingLeft = true; }
            if (e.key === 'ArrowRight') { e.preventDefault(); movingRight = true; }
            if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); gameOver ? reset() : jump(); }
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') movingLeft = false;
            if (e.key === 'ArrowRight') movingRight = false;
        });

        reset();
    </script>
</body>
