<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Побег копателя</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a00;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
canvas{border:3px solid #8B4513;border-radius:5px}
#btns{display:flex;gap:8px;margin-top:5px}
#btns button{width:60px;height:60px;font-size:22px;background:#8B4513;color:#FFD700;border:2px solid #FFD700;border-radius:10px;touch-action:manipulation}
#rst{background:#f85149;color:#fff;border-color:#fff;margin-top:5px;padding:10px 30px;font-size:18px;border-radius:10px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns">
<button onpointerdown="keys['a']=1" onpointerup="keys['a']=0">L</button>
<button onpointerdown="keys[' ']=1" onpointerup="keys[' ']=0">JUMP</button>
<button onpointerdown="keys['d']=1" onpointerup="keys['d']=0">R</button>
</div>
<button id="rst" onclick="restart()">ЗАНОВО</button>
<script>
let c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=400;c.height=550;
let player={x:185,y:500,w:30,h:30,vy:0,onGround:false};
let platforms=[],score=0,gameOver=false,highScore=0;
let keys={},cameraY=0,lastPlatformY=500;

// Создаём начальные платформы
platforms.push({x:160,y:520,w:80,h:12});
for(let i=1;i<12;i++){
    platforms.push({
        x:Math.random()*300+20,
        y:520-i*45,
        w:50+Math.random()*60,
        h:12
    });
}

document.addEventListener("keydown",e=>{keys[e.key]=1;e.preventDefault()});
document.addEventListener("keyup",e=>{keys[e.key]=0});

function restart(){
    player.x=185;player.y=500;player.vy=0;score=0;gameOver=false;
    platforms=[{x:160,y:520,w:80,h:12}];
    for(let i=1;i<12;i++)platforms.push({x:Math.random()*300+20,y:520-i*45,w:50+Math.random()*60,h:12});
    lastPlatformY=platforms[platforms.length-1].y;
    cameraY=0;
    document.getElementById("rst").style.display="none";
}

function loop(){
    if(!gameOver){
        // Гравитация
        player.vy+=0.6;
        player.y+=player.vy;
        
        // Столкновение с платформами
        for(let p of platforms){
            if(player.vy>0&&player.x+player.w>p.x&&player.x<p.x+p.w&&
               player.y+player.h>p.y&&player.y+player.h<p.y+p.h+15){
                player.y=p.y-player.h;
                player.vy=-9.5; // Прыжок
                player.onGround=true;
                break;
            }
        }
        
        // Движение
        if(keys["a"])player.x-=6;if(keys["d"])player.x+=6;
        if(player.x<-20)player.x=c.width;
        if(player.x>c.width+20)player.x=0;
        
        // Камера
        if(player.y<350){
            let diff=350-player.y;
            player.y=350;
            for(let p of platforms)p.y+=diff;
            cameraY+=diff;
            score=Math.floor(cameraY/10);
        }
        
        // Смерть
        if(player.y>c.height+50)gameOver=true;
        
        // Генерация платформ
        let topPlatform=platforms.reduce((a,b)=>a.y<b.y?a:b);
        while(topPlatform.y> -50){
            let px=Math.random()*320+20;
            let py=topPlatform.y-40-Math.random()*30;
            platforms.push({x:px,y:py,w:50+Math.random()*60,h:12});
            topPlatform={x:0,y:py,w:0,h:0};
        }
        
        // Удаление старых
        platforms=platforms.filter(p=>p.y<c.height+100);
    }
    
    // Рисование
    ctx.fillStyle="#2a1a00";ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="#8B4513";
    for(let p of platforms)ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#FFD700";ctx.fillRect(player.x,player.y,player.w,player.h);
    ctx.fillStyle="#000";ctx.fillRect(player.x+5,player.y+8,8,8);ctx.fillRect(player.x+17,player.y+8,8,8);
    ctx.fillStyle="#fff";ctx.font="18px sans-serif";
    ctx.fillText("Счёт: "+score,10,25);
    ctx.fillText("Рекорд: "+highScore,10,50);
    if(gameOver){
        if(score>highScore)highScore=score;
        document.getElementById("rst").style.display="block";
        ctx.fillStyle="#f00";ctx.font="28px sans-serif";
        ctx.fillText("GAME OVER",80,250);
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
