<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HabGame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}
canvas{border:2px solid #4CAF50;border-radius:10px}
#btns{display:flex;gap:10px;margin-top:10px}
#btns button{width:70px;height:70px;font-size:30px;background:#161b22;color:#4CAF50;border:2px solid #4CAF50;border-radius:10px;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns">
<button onpointerdown="keys['w']=1" onpointerup="keys['w']=0">▲</button>
<button onpointerdown="keys['a']=1" onpointerup="keys['a']=0">◀</button>
<button onpointerdown="keys['s']=1" onpointerup="keys['s']=0">▼</button>
<button onpointerdown="keys['d']=1" onpointerup="keys['d']=0">▶</button>
</div>
<script>
let c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=600;c.height=350;
let speed=3,keys={},players={},obstacles=[],me=null,myId=null;
obstacles.push({x:200,y:100,w:60,h:20});
obstacles.push({x:300,y:250,w:20,h:80});
obstacles.push({x:450,y:150,w:40,h:40});

let ws=new WebSocket("wss://habgame.onrender.com");
ws.onmessage=e=>{
    let d=JSON.parse(e.data);
    if(d.type==="init"){myId=d.id;players[d.id]={x:d.x,y:d.y,color:"#4CAF50"};me=players[d.id];}
    else if(d.type==="join"){players[d.id]={x:d.x,y:d.y,color:"#2196F3"};}
    else if(d.type==="move"){if(players[d.id]){players[d.id].x=d.x;players[d.id].y=d.y;}}
    else if(d.type==="leave"){delete players[d.id];}
};
function send(){if(myId&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"move",x:me.x,y:me.y}));}
document.addEventListener("keydown",e=>{keys[e.key]=1});
document.addEventListener("keyup",e=>{keys[e.key]=0});
function loop(){
    if(me){
        if(keys["w"])me.y-=speed;if(keys["s"])me.y+=speed;
        if(keys["a"])me.x-=speed;if(keys["d"])me.x+=speed;
        if(me.x<0)me.x=0;if(me.x>c.width-24)me.x=c.width-24;
        if(me.y<0)me.y=0;if(me.y>c.height-24)me.y=c.height-24;
        for(let o of obstacles){
            if(me.x<o.x+o.w&&me.x+24>o.x&&me.y<o.y+o.h&&me.y+24>o.y){
                if(keys["d"])me.x=o.x-24;if(keys["a"])me.x=o.x+o.w;
                if(keys["s"])me.y=o.y-24;if(keys["w"])me.y=o.y+o.h;
            }
        }
        send();
    }
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle="#555";for(let o of obstacles)ctx.fillRect(o.x,o.y,o.w,o.h);
    for(let id in players){
        let p=players[id];ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,24,24);
        ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.fillText(id===myId?"Ты":"Друг",p.x,p.y-5);
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
