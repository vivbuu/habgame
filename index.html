<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Побег копателя</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a00;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
canvas{border:3px solid #8B4513;border-radius:5px}
#btns{display:flex;gap:8px;margin-top:5px}
#btns button{width:60px;height:60px;font-size:22px;background:#8B4513;color:#FFD700;border:2px solid #FFD700;border-radius:10px;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns">
<button onpointerdown="keys['a']=1" onpointerup="keys['a']=0">L</button>
<button onpointerdown="keys[' ']=1" onpointerup="keys[' ']=0">JUMP</button>
<button onpointerdown="keys['d']=1" onpointerup="keys['d']=0">R</button>
</div>
<script>
let c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=400;c.height=550;
let player={x:180,y:70,w:30,h:30,vy:0,onGround:false};
let platforms=[],fallingPlatforms=[],score=0,gameOver=false,highScore=0;
let keys={},spawnTimer=0,jumpHeld=false;

// Стартовая платформа
platforms.push({x:150,y:500,w:100,h:12});

document.addEventListener("keydown",e=>{keys[e.key]=1;if(e.key==" ")jumpHeld=true;e.preventDefault()});
document.addEventListener("keyup",e=>{keys[e.key]=0;if(e.key==" ")jumpHeld=false});

function loop(){
    if(!gameOver){
        // Гравитация
        player.vy+=0.5;
        player.y+=player.vy;
        player.onGround=false;
        // Столкновение с платформами
        for(let p of platforms){
            if(player.x<p.x+p.w&&player.x+player.w>p.x&&
               player.y+player.h>p.y&&player.y+player.h<p.y+p.h+8&&player.vy>0){
                player.y=p.y-player.h;
                player.vy=0;
                player.onGround=true;
            }
        }
        // Прыжок
        if((keys[" "]||jumpHeld)&&player.onGround){player.vy=-9;player.onGround=false;}
        // Движение
        if(keys["a"])player.x-=5;if(keys["d"])player.x+=5;
        // Телепорт слева-направо
        if(player.x<-20)player.x=c.width;
        if(player.x>c.width+20)player.x=0;
        // Смерть при падении
        if(player.y>c.height+30)gameOver=true;
        // Счёт = высота в пикселях
        let h=Math.floor((500-player.y)/10);
        if(h>score)score=h;
        // Спавн новых платформ сверху
        spawnTimer++;
        if(spawnTimer>40){
            spawnTimer=0;
            let px=Math.random()*(c.width-80);
            let py=-20;
            platforms.push({x:px,y:py,w:60+Math.random()*80,h:12});
            // Иногда падающая платформа
            if(Math.random()<0.25)fallingPlatforms.push({x:px,y:py,w:60+Math.random()*80,h:12});
        }
        // Двигаем платформы вниз (камера)
        for(let p of platforms)p.y+=2;
        for(let p of fallingPlatforms)p.y+=2;
        // Удаляем ушедшие
        platforms=platforms.filter(p=>p.y<c.height+50);
        fallingPlatforms=fallingPlatforms.filter(p=>p.y<c.height+50);
        // Падающие ломаются при касании
        for(let p of fallingPlatforms){
            if(player.x<p.x+p.w&&player.x+player.w>p.x&&
               player.y+player.h>p.y&&player.y+player.h<p.y+p.h+8&&player.vy>0){
                fallingPlatforms.splice(fallingPlatforms.indexOf(p),1);
                player.vy=-6;
            }
        }
    }
    // Рисование
    ctx.fillStyle="#2a1a00";ctx.fillRect(0,0,c.width,c.height);
    // Обычные платформы
    ctx.fillStyle="#8B4513";
    for(let p of platforms)ctx.fillRect(p.x,p.y,p.w,p.h);
    // Падающие платформы
    ctx.fillStyle="#FF6347";
    for(let p of fallingPlatforms)ctx.fillRect(p.x,p.y,p.w,p.h);
    // Игрок
    ctx.fillStyle="#FFD700";ctx.fillRect(player.x,player.y,player.w,player.h);
    ctx.fillStyle="#000";ctx.fillRect(player.x+5,player.y+8,8,8);ctx.fillRect(player.x+17,player.y+8,8,8);
    // UI
    ctx.fillStyle="#fff";ctx.font="18px sans-serif";
    ctx.fillText("Счёт: "+score,10,25);
    ctx.fillText("Рекорд: "+highScore,10,50);
    if(gameOver){
        if(score>highScore)highScore=score;
        ctx.fillStyle="#f00";ctx.font="28px sans-serif";
        ctx.fillText("GAME OVER",80,250);
        ctx.fillText("Тапни чтобы начать",60,290);
        if(keys[" "]||keys["r"]){
            player.x=180;player.y=70;player.vy=0;score=0;gameOver=false;
            platforms=[{x:150,y:500,w:100,h:12}];fallingPlatforms=[];
        }
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
