<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HabGame</title>
<style>
body{background:#0d1117;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
canvas{background:#111;border:2px solid #4CAF50}
</style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<script>
let c=document.getElementById("c"),ctx=c.getContext("2d");
let x=50,y=50,size=20;
function draw(){
    ctx.clearRect(0,0,400,400);
    ctx.fillStyle="#4CAF50";
    ctx.fillRect(x,y,size,size);
    requestAnimationFrame(draw);
}
document.addEventListener("keydown",function(e){
    if(e.key=="w")y-=5;
    if(e.key=="s")y+=5;
    if(e.key=="a")x-=5;
    if(e.key=="d")x+=5;
});
c.addEventListener("touchstart",function(e){
    e.preventDefault();
    let t=e.touches[0];
    let rect=c.getBoundingClientRect();
    let tx=t.clientX-rect.left;
    let ty=t.clientY-rect.top;
    x=tx-size/2;
    y=ty-size/2;
});
c.addEventListener("touchmove",function(e){
    e.preventDefault();
    let t=e.touches[0];
    let rect=c.getBoundingClientRect();
    x=t.clientX-rect.left-size/2;
    y=t.clientY-rect.top-size/2;
});
draw();
</script>
</body>
</html>
