<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            font-family: monospace;
            touch-action: manipulation;
        }
        canvas {
            border: 2px solid #e94560;
            border-radius: 8px;
            background: #16213e;
        }
        #score {
            color: #e94560;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #controls {
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px 80px;
            gap: 5px;
            margin-top: 15px;
        }
        .btn {
            background: #e94560;
            border: none;
            border-radius: 10px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            user-select: none;
        }
        .btn:active {
            background: #ff6b6b;
        }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="game"></canvas>
    <div id="controls">
        <div></div>
        <button class="btn" ontouchstart="changeDir(0,-1)" onclick="changeDir(0,-1)">▲</button>
        <div></div>
        <button class="btn" ontouchstart="changeDir(-1,0)" onclick="changeDir(-1,0)">◄</button>
        <button class="btn" style="background:#16213e;font-size:16px;" onclick="resetGame()">↻</button>
        <button class="btn" ontouchstart="changeDir(1,0)" onclick="changeDir(1,0)">►</button>
        <div></div>
        <button class="btn" ontouchstart="changeDir(0,1)" onclick="changeDir(0,1)">▼</button>
        <div></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score');

        const size = 20;
        const cols = 16;
        const rows = 20;
        canvas.width = cols * size;
        canvas.height = rows * size;

        let snake, food, dir, nextDir, score, gameOver, speed, gameLoop;

        function resetGame() {
            snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
            dir = {x: 1, y: 0};
            nextDir = {x: 1, y: 0};
            score = 0;
            gameOver = false;
            speed = 120;
            scoreEl.textContent = 'Счёт: 0';
            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function changeDir(dx, dy) {
            if (gameOver) return;
            if (dir.x + dx === 0 && dir.y + dy === 0) return;
            nextDir = {x: dx, y: dy};
        }

        function update() {
            if (gameOver) return;
            dir = {...nextDir};
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                endGame();
                return;
            }
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = 'Счёт: ' + score;
                spawnFood();
                if (speed > 50) { speed -= 2; clearInterval(gameLoop); gameLoop = setInterval(update, speed); }
            } else {
                snake.pop();
            }

            draw();
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e94560';
            ctx.font = '20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Игра окончена!', canvas.width/2, canvas.height/2 - 10);
            ctx.font = '14px monospace';
            ctx.fillText('Нажми ↻', canvas.width/2, canvas.height/2 + 20);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Еда
            ctx.fillStyle = '#f0c929';
            ctx.beginPath();
            ctx.arc(food.x * size + size/2, food.y * size + size/2, size/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Змейка
            snake.forEach((s, i) => {
                const alpha = 1 - (i / (snake.length + 10)) * 0.5;
                ctx.fillStyle = i === 0 ? '#00ff88' : `rgba(0, 200, 100, ${alpha})`;
                ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);
            });
        }

        // Свайпы
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                changeDir(dx > 0 ? 1 : -1, 0);
            } else {
                changeDir(0, dy > 0 ? 1 : -1);
            }
        });

        // Клавиатура
        document.addEventListener('keydown', e => {
            const keys = {ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0]};
            if (keys[e.key]) changeDir(keys[e.key][0], keys[e.key][1]);
        });

        resetGame();
        draw();

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('touchstart', e => e.preventDefault());
        });
        
    </script>
</body>
</html>
